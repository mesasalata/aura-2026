#       onboarding_done: "true"
#   mock:
#     - url: "/api/stats"
#       fixture: ../fixtures/stats.json
#   inject:
#     css: ../prepare/demo.css

output:
  format: mp4
  fps: 30
  preset: balanced  # social | balanced | archive

steps:
  - name: "Open app"
    captureDelay: 100
    holdDuration: 1000
    actions:
      - action: navigate
        url: "http://localhost:3000"
        waitUntil: load

  - name: "Click button"
    captureDelay: 50
    holdDuration: 800
    actions:
      - action: click
        selector: "#my-button"
