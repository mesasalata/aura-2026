name: "My Demo"
viewport:
  width: 1280
  height: 800

effects:
  deviceFrame:
    enabled: true
    type: browser
  cursor:
    enabled: true
    clickEffect: true
    highlight: true
  background:
    type: gradient
    value: "linear-gradient(135deg, #667eea 0%, #764ba2 100%)"
    padding: 48
    borderRadius: 14
    shadow: true

# Recording-time injection - tweak the page without touching your code.
# All assets referenced here resolve relative to this file.
# prepare:
#   hide:
#     - "#cookie-banner"
#   freezeTime: "2026-06-10T09:00:00Z"
