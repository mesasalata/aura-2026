# Keynote-style launch video - runs AS-IS against the hosted demo.
# Try it first:  clipwise record .clipwise/scenarios/keynote.yaml
# Then replace the url + selectors with your own app.

name: "My Launch Video"
viewport: { width: 1280, height: 800, deviceScaleFactor: 2 }   # 2 = retina quality

# Optional extras (uncomment to use):
# audio: { file: "https://assets.mixkit.co/music/132/132.mp3", bpm: 120, volume: 0.32, fadeOut: 2000 }
# captions:
#   - { text: "Recorded from a real app", start: 0.4, end: 2.4 }

effects:
  cursor: { enabled: true, clickEffect: true, highlight: false, trail: false }

output:
  format: mp4
  fps: 30
  preset: balanced
  filename: keynote
  # aspects: ["9:16"]        # also render a reels-format file in the same run

scenes:
  # footage take - recorded once; vignettes below quote it by step
  - type: screen
    id: demo
    steps:
      - name: "Open"
        captureDelay: 120
        holdDuration: 1400
        actions:
          - action: navigate
            url: "https://kwakseongjae.github.io/clipwise/demo/"   # ← your app URL
            waitUntil: networkidle
      - name: "Stats"
        captureDelay: 50
        holdDuration: 700
        actions:
          - { action: hover, selector: "#stat-users" }             # ← your selectors
      - name: "Search"
        captureDelay: 50
        holdDuration: 500
        actions:
          - { action: type, selector: "#search-input", text: "growth report", delay: 28 }
      - name: "Switch tab"
        captureDelay: 50
        holdDuration: 1100
        actions:
          - { action: click, selector: "#tab-daily" }
      - name: "Table"
        captureDelay: 80
        holdDuration: 1300
        actions:
          - action: scroll
            y: 420
            smooth: true

  # ── timeline ──
  - type: motion
    template: kinetic-type
    duration: 2200
    props: { lines: "Ship *demos*,||not edits.", size: 86 }

  - type: vignette
    footage: demo
    duration: 4200
    layout: hero
    num: "01"
    label: "Cinematic camera"
    caption: "Recorded from a real app - *zero code changes*"
    push: { from: 1.02, to: 1.1 }
    start: { step: 0, offset: 0.15 }
    fx:
      - { kind: circle, selector: "#stat-users", delay: 2700 }

  - type: vignette
    footage: demo
    duration: 4000
    layout: crop
    num: "02"
    label: "Close-up"
    caption: "Selector-measured crop - *no pixel guessing*"
    crop: { selector: "#chart-area", pad: 14 }
    push: { from: 1.04, to: 1 }
    start: { step: 3 }
    rate: 1.1

  - type: motion
    template: kinetic-type
    duration: 1900
    props: { lines: "Your code,||*untouched.*", size: 80, fx: marker }

  - type: motion
    template: kinetic-type
    duration: 2600
    props: { lines: "*My Product*", size: 90, sub: "npx clipwise@latest init" }
